<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
  <title id="t">스케줄러를 미는 세 함수가 각각 무엇을 돌리나</title>
  <desc id="d">가상 시계 0초에 A, 2초에 B, 3초에 C가 잡혀 있다. runCurrent는 지금 시각 0초의 A만 돌리고 시계는 0초에 그대로 있다. advanceTimeBy(2초)는 2초보다 앞선 일인 A만 돌리고 시계를 2초로 민다. 정확히 2초에 잡힌 B는 돌지 않으므로, B까지 돌리려면 이어서 runCurrent를 불러야 한다. advanceUntilIdle은 대기열이 빌 때까지 A, B, C를 모두 돌리고 시계는 마지막 일의 시각인 3초에 멈춘다.</desc>
  <style>
    text { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; fill: #1b2733; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .soft { fill: #4a5866; }
    .title { font-weight: 700; }
    .axis { stroke: #8a949e; stroke-width: 1.5; }
    .tick { stroke: #a3adb7; stroke-width: 1.2; stroke-dasharray: 3 5; }
    .run { fill: #e1f2ec; stroke: #2e7d6b; stroke-width: 2; }
    .wait { fill: #f3f5f7; stroke: #a3adb7; stroke-width: 2; stroke-dasharray: 5 4; }
    .clock { fill: #b5852a; }
    .clocktext { fill: #8a5a12; font-weight: 700; }
    .band { fill: #f7f9fa; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e4e9ee; }
      .soft { fill: #9fadba; }
      .axis { stroke: #75808b; }
      .tick { stroke: #5b6773; }
      .run { fill: #15302a; stroke: #6cc4ad; }
      .wait { fill: #1a232c; stroke: #5b6773; }
      .clock { fill: #e0b860; }
      .clocktext { fill: #e0b860; }
      .band { fill: #161d24; }
    }
  </style>

  <!-- 시간 눈금 -->
  <text class="soft" x="300" y="34" font-size="12.5" text-anchor="middle">0초</text>
  <text class="soft" x="500" y="34" font-size="12.5" text-anchor="middle">1초</text>
  <text class="soft" x="700" y="34" font-size="12.5" text-anchor="middle">2초</text>
  <text class="soft" x="900" y="34" font-size="12.5" text-anchor="middle">3초</text>
  <path class="axis" d="M260 46 H960"/>
  <path class="tick" d="M300 46 V440"/>
  <path class="tick" d="M500 46 V440"/>
  <path class="tick" d="M700 46 V440"/>
  <path class="tick" d="M900 46 V440"/>

  <!-- 대기열 -->
  <text class="title" x="24" y="88" font-size="14">처음 대기열</text>
  <text class="soft" x="24" y="108" font-size="12">일 세 개가 잡혀 있다</text>
  <rect class="wait" x="274" y="70" width="52" height="34" rx="8"/><text x="300" y="92" font-size="14" text-anchor="middle">A</text>
  <rect class="wait" x="674" y="70" width="52" height="34" rx="8"/><text x="700" y="92" font-size="14" text-anchor="middle">B</text>
  <rect class="wait" x="874" y="70" width="52" height="34" rx="8"/><text x="900" y="92" font-size="14" text-anchor="middle">C</text>

  <!-- runCurrent -->
  <rect class="band" x="10" y="134" width="980" height="92" rx="8"/>
  <text class="title mono" x="24" y="166" font-size="14">runCurrent()</text>
  <text class="soft" x="24" y="188" font-size="12">지금 시각의 일만</text>
  <rect class="run" x="274" y="148" width="52" height="34" rx="8"/><text x="300" y="170" font-size="14" text-anchor="middle">A</text>
  <rect class="wait" x="674" y="148" width="52" height="34" rx="8"/><text class="soft" x="700" y="170" font-size="14" text-anchor="middle">B</text>
  <rect class="wait" x="874" y="148" width="52" height="34" rx="8"/><text class="soft" x="900" y="170" font-size="14" text-anchor="middle">C</text>
  <path class="clock" d="M300 196 l-7 12 h14 z"/>
  <text class="clocktext" x="316" y="210" font-size="12">시계는 0초 그대로</text>

  <!-- advanceTimeBy -->
  <rect class="band" x="10" y="238" width="980" height="92" rx="8"/>
  <text class="title mono" x="24" y="270" font-size="14">advanceTimeBy(2초)</text>
  <text class="soft" x="24" y="292" font-size="12">2초 "직전"까지만</text>
  <rect class="run" x="274" y="252" width="52" height="34" rx="8"/><text x="300" y="274" font-size="14" text-anchor="middle">A</text>
  <rect class="wait" x="674" y="252" width="52" height="34" rx="8"/><text class="soft" x="700" y="274" font-size="14" text-anchor="middle">B</text>
  <rect class="wait" x="874" y="252" width="52" height="34" rx="8"/><text class="soft" x="900" y="274" font-size="14" text-anchor="middle">C</text>
  <path class="clock" d="M700 300 l-7 12 h14 z"/>
  <text class="clocktext" x="560" y="314" font-size="12" text-anchor="middle">시계는 2초로 — B는 아직</text>
  <text class="soft" x="740" y="314" font-size="12">B까지 돌리려면 이어서 runCurrent()</text>

  <!-- advanceUntilIdle -->
  <rect class="band" x="10" y="342" width="980" height="92" rx="8"/>
  <text class="title mono" x="24" y="374" font-size="14">advanceUntilIdle()</text>
  <text class="soft" x="24" y="396" font-size="12">대기열이 빌 때까지</text>
  <rect class="run" x="274" y="356" width="52" height="34" rx="8"/><text x="300" y="378" font-size="14" text-anchor="middle">A</text>
  <rect class="run" x="674" y="356" width="52" height="34" rx="8"/><text x="700" y="378" font-size="14" text-anchor="middle">B</text>
  <rect class="run" x="874" y="356" width="52" height="34" rx="8"/><text x="900" y="378" font-size="14" text-anchor="middle">C</text>
  <path class="clock" d="M900 404 l-7 12 h14 z"/>
  <text class="clocktext" x="884" y="418" font-size="12" text-anchor="end">시계는 마지막 일의 시각 3초에서 멈춘다</text>

  <text class="soft" x="500" y="462" font-size="12" text-anchor="middle">초록 = 이번 호출에서 돈 일, 점선 = 아직 대기열에 남은 일, 삼각형 = 호출이 끝난 뒤 가상 시계 위치</text>
</svg>
