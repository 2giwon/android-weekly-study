<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="t d">
  <title id="t">StateFlow로 만든 구독 공유와 재생 정책</title>
  <desc id="d">구독 서버가 SubscriptionRepository로 값을 보낸다. 이 저장소가 StateFlow로 구독 상태를 들고 있는 단 하나의 주인이다. 저장소에서 플레이어 ViewModel, 계정 ViewModel, 재생 정책 계산으로 화살표가 갈라진다. 플레이어 ViewModel은 플레이어 화면으로, 계정 ViewModel은 계정 화면으로 이어진다. 재생 정책 계산은 flatMapLatest, map, stateIn을 쓰고 재생 서비스로, 재생 서비스는 플레이어와 광고 스케줄러로 이어진다. 맨 아래에는 지금 곡은 계속 재생하고 다음 곡부터 무료 요금제 광고 규칙과 Medium 음질을 쓴다고 적혀 있다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; fill: #1b2733; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .soft { fill: #4a5866; }
    .title { font-weight: 700; }
    .line { stroke: #6b7885; stroke-width: 2.2; fill: none; }
    .head { fill: #6b7885; }
    .box { fill: #f7f9fa; stroke: #6b7885; stroke-width: 2; }
    .owner { fill: #e1f2ec; stroke: #2e7d6b; stroke-width: 2.4; }
    .calc { fill: #fff6e0; stroke: #b5852a; stroke-width: 2.4; }
    .note { fill: #2e7d6b; font-weight: 700; }
    .rule { fill: #8a5a12; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e4e9ee; }
      .soft { fill: #9fadba; }
      .line { stroke: #8795a3; }
      .head { fill: #8795a3; }
      .box { fill: #1a232c; stroke: #75808b; }
      .owner { fill: #15302a; stroke: #6cc4ad; }
      .calc { fill: #33291a; stroke: #e0b860; }
      .note { fill: #6cc4ad; }
      .rule { fill: #e0b860; }
    }
  </style>

  <rect class="box" x="380" y="20" width="240" height="52" rx="10"/>
  <text class="title" x="500" y="52" font-size="15" text-anchor="middle">구독 서버</text>
  <path class="line" d="M500 72 V106" marker-end="url(#arrow)"/>

  <rect class="owner" x="340" y="108" width="320" height="76" rx="10"/>
  <text class="title mono" x="500" y="140" font-size="14" text-anchor="middle">SubscriptionRepository</text>
  <text class="mono" x="500" y="166" font-size="13" text-anchor="middle">StateFlow&lt;Subscription&gt;</text>
  <text class="note" x="678" y="136" font-size="13">공유하는 주인은 하나</text>

  <path class="line" d="M340 150 C 240 150 170 170 160 226" marker-end="url(#arrow)"/>
  <path class="line" d="M660 150 C 760 170 830 180 840 226" marker-end="url(#arrow)"/>
  <path class="line" d="M500 184 V226" marker-end="url(#arrow)"/>

  <rect class="box" x="50" y="228" width="220" height="56" rx="10"/>
  <text x="160" y="262" font-size="14" text-anchor="middle">플레이어 ViewModel</text>
  <path class="line" d="M160 284 V336" marker-end="url(#arrow)"/>
  <rect class="box" x="70" y="338" width="180" height="52" rx="10"/>
  <text x="160" y="370" font-size="14" text-anchor="middle">플레이어 화면</text>

  <rect class="box" x="730" y="228" width="220" height="56" rx="10"/>
  <text x="840" y="262" font-size="14" text-anchor="middle">계정 ViewModel</text>
  <path class="line" d="M840 284 V336" marker-end="url(#arrow)"/>
  <rect class="box" x="750" y="338" width="180" height="52" rx="10"/>
  <text x="840" y="370" font-size="14" text-anchor="middle">계정 화면</text>

  <rect class="calc" x="360" y="228" width="280" height="84" rx="10"/>
  <text class="title" x="500" y="256" font-size="14" text-anchor="middle">재생 정책 <tspan class="mono" font-size="13">PlaybackPolicy</tspan></text>
  <text class="mono" x="500" y="280" font-size="12.5" text-anchor="middle">flatMapLatest + map</text>
  <text class="mono" x="500" y="299" font-size="12.5" text-anchor="middle">+ stateIn</text>
  <path class="line" d="M500 312 V352" marker-end="url(#arrow)"/>

  <rect class="box" x="390" y="354" width="220" height="52" rx="10"/>
  <text x="500" y="386" font-size="14" text-anchor="middle">재생 서비스</text>
  <text class="rule" x="500" y="426" font-size="12.5" text-anchor="middle">다음 곡을 준비할 때 적용한다</text>
  <path class="line" d="M500 406 V410"/>
  <path class="line" d="M500 436 V470" marker-end="url(#arrow)"/>

  <rect class="box" x="370" y="472" width="260" height="52" rx="10"/>
  <text x="500" y="504" font-size="14" text-anchor="middle">플레이어 + 광고 스케줄러</text>

  <rect class="calc" x="220" y="552" width="560" height="84" rx="12"/>
  <text class="title" x="500" y="586" font-size="15" text-anchor="middle">지금 곡은 끝까지 재생한다</text>
  <text class="title" x="500" y="614" font-size="15" text-anchor="middle">다음 곡부터 무료 요금제 광고 규칙 + Medium 음질</text>
  <text class="soft" x="500" y="668" font-size="12.5" text-anchor="middle">화면과 서비스가 같은 프로세스에서 공유 상태를 지켜본다</text>
</svg>
