<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
  <title id="t">VSync 틱과 프레임 놓침</title>
  <desc id="d">위 줄은 평소 모습이다. 점선으로 그린 VSync 틱마다 UI 스레드가 짧은 작업을 끝내고, 다음 틱에 그 프레임이 화면에 표시된다. 아래 줄은 두 번째 틱 뒤의 작업이 길어져 세 번째 틱을 넘긴 경우다. 세 번째 틱에는 보여 줄 새 프레임이 없어 놓치고, 그 작업 결과는 네 번째 틱에야 표시된다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; fill: #1b2733; }
    .soft { fill: #4a5866; }
    .title { font-weight: 700; }
    .axis { stroke: #8a949e; stroke-width: 1.5; fill: none; }
    .head { fill: #8a949e; }
    .tick { stroke: #3b6ea8; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .badtick { stroke: #b4473a; stroke-width: 1.6; stroke-dasharray: 3 4; }
    .ui { fill: #e1f2ec; stroke: #2e7d6b; stroke-width: 1.6; }
    .slow { fill: #fbe9e7; stroke: #b4473a; stroke-width: 1.8; }
    .oklabel { fill: #2e7d6b; font-weight: 700; }
    .badlabel { fill: #b4473a; font-weight: 700; }
    .ticklabel { fill: #3b6ea8; }
    .band { fill: #f3f5f7; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e4e9ee; }
      .soft { fill: #9fadba; }
      .axis { stroke: #75808b; }
      .head { fill: #75808b; }
      .tick { stroke: #7fb0e6; }
      .badtick { stroke: #e58a7d; }
      .ui { fill: #15302a; stroke: #6cc4ad; }
      .slow { fill: #3a1d1a; stroke: #e58a7d; }
      .oklabel { fill: #6cc4ad; }
      .badlabel { fill: #e58a7d; }
      .ticklabel { fill: #7fb0e6; }
      .band { fill: #161d24; }
    }
  </style>

  <!-- 위: 평소 -->
  <rect class="band" x="10" y="14" width="980" height="200" rx="10"/>
  <text class="title oklabel" x="30" y="44" font-size="15">평소: 틱이 오기 전에 다음 프레임이 준비된다</text>
  <text class="ticklabel" x="30" y="84" font-size="12">VSync 틱</text>
  <text x="30" y="128" font-size="13">UI 스레드</text>
  <path class="axis" d="M200 124 H975" marker-end="url(#arrow)"/>
  <line class="tick" x1="220" y1="72" x2="220" y2="152"/>
  <line class="tick" x1="370" y1="72" x2="370" y2="152"/>
  <line class="tick" x1="520" y1="72" x2="520" y2="152"/>
  <line class="tick" x1="670" y1="72" x2="670" y2="152"/>
  <line class="tick" x1="820" y1="72" x2="820" y2="152"/>
  <line class="tick" x1="970" y1="72" x2="970" y2="152"/>
  <rect class="ui" x="226" y="104" width="40" height="20" rx="4"/>
  <rect class="ui" x="376" y="104" width="56" height="20" rx="4"/>
  <rect class="ui" x="526" y="104" width="22" height="20" rx="4"/>
  <rect class="ui" x="676" y="104" width="46" height="20" rx="4"/>
  <rect class="ui" x="826" y="104" width="64" height="20" rx="4"/>
  <text class="oklabel" x="370" y="172" font-size="12.5" text-anchor="middle">표시</text>
  <text class="oklabel" x="520" y="172" font-size="12.5" text-anchor="middle">표시</text>
  <text class="oklabel" x="670" y="172" font-size="12.5" text-anchor="middle">표시</text>
  <text class="oklabel" x="820" y="172" font-size="12.5" text-anchor="middle">표시</text>
  <text class="oklabel" x="970" y="172" font-size="12.5" text-anchor="end">표시</text>
  <text class="soft" x="30" y="200" font-size="12.5">초록 상자는 다음 프레임을 만드는 일이다. 틱 사이에 끝나고 남는 시간에는 스레드가 쉰다.</text>

  <!-- 아래: 프레임 놓침 -->
  <rect class="band" x="10" y="234" width="980" height="200" rx="10"/>
  <text class="title badlabel" x="30" y="264" font-size="15">한 번 늦으면: 그 틱에는 보여 줄 새 프레임이 없다</text>
  <text class="ticklabel" x="30" y="304" font-size="12">VSync 틱</text>
  <text x="30" y="348" font-size="13">UI 스레드</text>
  <path class="axis" d="M200 344 H975" marker-end="url(#arrow)"/>
  <line class="tick" x1="220" y1="292" x2="220" y2="372"/>
  <line class="tick" x1="370" y1="292" x2="370" y2="372"/>
  <line class="badtick" x1="520" y1="292" x2="520" y2="372"/>
  <line class="tick" x1="670" y1="292" x2="670" y2="372"/>
  <line class="tick" x1="820" y1="292" x2="820" y2="372"/>
  <line class="tick" x1="970" y1="292" x2="970" y2="372"/>
  <rect class="ui" x="226" y="324" width="40" height="20" rx="4"/>
  <rect class="slow" x="376" y="324" width="214" height="20" rx="4"/>
  <rect class="ui" x="676" y="324" width="46" height="20" rx="4"/>
  <rect class="ui" x="826" y="324" width="64" height="20" rx="4"/>
  <text class="oklabel" x="370" y="392" font-size="12.5" text-anchor="middle">표시</text>
  <text class="badlabel" x="520" y="392" font-size="12.5" text-anchor="middle">놓침</text>
  <text class="oklabel" x="670" y="392" font-size="12.5" text-anchor="middle">늦게 표시</text>
  <text class="oklabel" x="820" y="392" font-size="12.5" text-anchor="middle">표시</text>
  <text class="oklabel" x="970" y="392" font-size="12.5" text-anchor="end">표시</text>
  <text class="soft" x="30" y="420" font-size="12.5">빨간 상자가 틱 하나를 넘겼다. 그 틱에는 이전 화면이 그대로 남아, 사용자는 잠깐 멈춘 것처럼 느낀다.</text>
</svg>
