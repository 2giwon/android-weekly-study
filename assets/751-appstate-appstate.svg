<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t d">
  <title id="t">AppState로 만든 구독 공유와 재생 정책</title>
  <desc id="d">구독 서버가 SubscriptionManager로 값을 보낸다. 매니저 안에 StateStore가 있고 Compose State로 구독 상태를 들고 있으며, 이것이 단 하나의 주인이다. 매니저에서 플레이어 ViewModel, 계정 ViewModel, Transform으로 화살표가 갈라진다. ViewModel은 그대로 남아 각자의 화면으로 이어진다. Transform은 재생 정책을 State로 계산할 뿐 플레이어에 명령을 내리지 않는다. Transform은 재생 서비스로, 재생 서비스는 플레이어와 광고 스케줄러로 이어진다. 동작은 StateFlow 그림과 같다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; fill: #1b2733; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .soft { fill: #4a5866; }
    .title { font-weight: 700; }
    .line { stroke: #6b7885; stroke-width: 2.2; fill: none; }
    .head { fill: #6b7885; }
    .box { fill: #f7f9fa; stroke: #6b7885; stroke-width: 2; }
    .owner { fill: #e1f2ec; stroke: #2e7d6b; stroke-width: 2.4; }
    .calc { fill: #fff6e0; stroke: #b5852a; stroke-width: 2.4; }
    .note { fill: #2e7d6b; font-weight: 700; }
    .rule { fill: #8a5a12; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e4e9ee; }
      .soft { fill: #9fadba; }
      .line { stroke: #8795a3; }
      .head { fill: #8795a3; }
      .box { fill: #1a232c; stroke: #75808b; }
      .owner { fill: #15302a; stroke: #6cc4ad; }
      .calc { fill: #33291a; stroke: #e0b860; }
      .note { fill: #6cc4ad; }
      .rule { fill: #e0b860; }
    }
  </style>

  <rect class="box" x="380" y="20" width="240" height="52" rx="10"/>
  <text class="title" x="500" y="52" font-size="15" text-anchor="middle">구독 서버</text>
  <path class="line" d="M500 72 V106" marker-end="url(#arrow)"/>

  <rect class="box" x="330" y="108" width="340" height="118" rx="10"/>
  <text class="title mono" x="500" y="134" font-size="14" text-anchor="middle">SubscriptionManager</text>
  <rect class="owner" x="360" y="146" width="280" height="68" rx="8"/>
  <text class="title mono" x="500" y="174" font-size="14" text-anchor="middle">StateStore</text>
  <text class="mono" x="500" y="198" font-size="13" text-anchor="middle">State&lt;Subscription&gt;</text>
  <text class="note" x="688" y="136" font-size="13">공유하는 주인은 하나</text>

  <path class="line" d="M330 170 C 230 175 170 200 160 262" marker-end="url(#arrow)"/>
  <path class="line" d="M670 170 C 770 180 830 200 840 262" marker-end="url(#arrow)"/>
  <path class="line" d="M500 226 V262" marker-end="url(#arrow)"/>

  <rect class="box" x="50" y="264" width="220" height="56" rx="10"/>
  <text x="160" y="298" font-size="14" text-anchor="middle">플레이어 ViewModel</text>
  <path class="line" d="M160 320 V372" marker-end="url(#arrow)"/>
  <rect class="box" x="70" y="374" width="180" height="52" rx="10"/>
  <text x="160" y="406" font-size="14" text-anchor="middle">플레이어 화면</text>

  <rect class="box" x="730" y="264" width="220" height="56" rx="10"/>
  <text x="840" y="298" font-size="14" text-anchor="middle">계정 ViewModel</text>
  <path class="line" d="M840 320 V372" marker-end="url(#arrow)"/>
  <rect class="box" x="750" y="374" width="180" height="52" rx="10"/>
  <text x="840" y="406" font-size="14" text-anchor="middle">계정 화면</text>

  <rect class="calc" x="370" y="264" width="260" height="72" rx="10"/>
  <text class="title mono" x="500" y="292" font-size="14" text-anchor="middle">Transform</text>
  <text class="mono" x="500" y="318" font-size="13" text-anchor="middle">State&lt;PlaybackPolicy&gt;</text>
  <text class="note" x="500" y="356" font-size="12.5" text-anchor="middle">정책만 계산하고 플레이어에 명령하지 않는다</text>
  <path class="line" d="M500 366 V400" marker-end="url(#arrow)"/>

  <rect class="box" x="390" y="402" width="220" height="52" rx="10"/>
  <text x="500" y="434" font-size="14" text-anchor="middle">재생 서비스</text>
  <text class="rule" x="500" y="474" font-size="12.5" text-anchor="middle">다음 곡을 준비할 때 적용한다</text>
  <path class="line" d="M500 484 V516" marker-end="url(#arrow)"/>

  <rect class="box" x="370" y="518" width="260" height="52" rx="10"/>
  <text x="500" y="550" font-size="14" text-anchor="middle">플레이어 + 광고 스케줄러</text>

  <rect class="calc" x="220" y="592" width="560" height="84" rx="12"/>
  <text class="title" x="500" y="626" font-size="15" text-anchor="middle">지금 곡은 끝까지 재생한다</text>
  <text class="title" x="500" y="654" font-size="15" text-anchor="middle">다음 곡부터 무료 요금제 광고 규칙 + Medium 음질</text>
  <text class="soft" x="500" y="702" font-size="12.5" text-anchor="middle">같은 프로세스이고, ViewModel은 그대로 남는다. 동작은 StateFlow 그림과 같다</text>
</svg>
