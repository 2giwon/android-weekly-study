<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
  <title id="t">지우기 전에 사람의 승인을 받는 순서</title>
  <desc id="d">사용자가 저장한 메모를 모두 지워 달라고 하면 ADK Runner가 Gemma 모델에 요청을 넘기고, 모델은 clear_all_notes 함수를 부르라고 답한다. Runner가 도구를 처음 실행하면 도구는 승인 정보가 없음을 보고 지우지 않은 채 requestConfirmation으로 승인을 요청하고 승인 대기 상태를 돌려준다. Runner는 화면에 확인 요청을 보내고, 화면은 승인과 거부 버튼이 있는 대화상자를 띄운다. 사용자가 승인을 누르면 화면이 submitConfirmation으로 결정을 Runner에 보내고, Runner는 같은 도구를 두 번째로 실행한다. 이번에는 승인 정보가 있고 confirmed가 참이라 도구가 메모를 지우고 지운 개수 5를 돌려준다. 마지막으로 사용자에게 승인을 받아 메모 5개를 지웠다고 답한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; fill: #1b2733; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .soft { fill: #4a5866; }
    .title { font-weight: 700; }
    .life { stroke: #a3adb7; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .line { stroke: #6b7885; stroke-width: 2; fill: none; }
    .back { stroke: #6b7885; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .head { fill: #6b7885; }
    .actor { fill: #f3f5f7; stroke: #8a949e; stroke-width: 2; }
    .ui { fill: #fbe9e7; stroke: #b4473a; stroke-width: 2; }
    .run { fill: #fff6e0; stroke: #b5852a; stroke-width: 2; }
    .model { fill: #e3ecf5; stroke: #2f5d8a; stroke-width: 2; }
    .tool { fill: #e1f2ec; stroke: #2e7d6b; stroke-width: 2; }
    .note { fill: #fffbf2; stroke: #b5852a; stroke-width: 1.5; }
    .pass1 { fill: #f7f2e6; }
    .pass2 { fill: #ebf4ef; }
    .passlabel { font-weight: 700; fill: #8a5a12; }
    .passlabel2 { font-weight: 700; fill: #2e7d6b; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e4e9ee; }
      .soft { fill: #9fadba; }
      .life { stroke: #5b6773; }
      .line, .back { stroke: #8795a3; }
      .head { fill: #8795a3; }
      .actor { fill: #1a232c; stroke: #75808b; }
      .ui { fill: #3a1d1a; stroke: #e58a7d; }
      .run { fill: #33291a; stroke: #e0b860; }
      .model { fill: #1b2a3a; stroke: #7fb0dd; }
      .tool { fill: #15302a; stroke: #6cc4ad; }
      .note { fill: #241f17; stroke: #e0b860; }
      .pass1 { fill: #1f1b14; }
      .pass2 { fill: #14221d; }
      .passlabel { fill: #e0b860; }
      .passlabel2 { fill: #6cc4ad; }
    }
  </style>

  <!-- 구간 배경 -->
  <rect class="pass1" x="8" y="236" width="984" height="230" rx="8"/>
  <text class="passlabel" x="20" y="256" font-size="12">1차 실행 — 지우지 않고 멈춘다</text>
  <rect class="pass2" x="8" y="474" width="984" height="214" rx="8"/>
  <text class="passlabel2" x="20" y="494" font-size="12">2차 실행 — 승인을 받고 다시 부른다</text>

  <!-- 참여자 -->
  <rect class="actor" x="30" y="14" width="120" height="50" rx="10"/>
  <text class="title" x="90" y="44" font-size="14" text-anchor="middle">사용자</text>
  <rect class="ui" x="200" y="14" width="160" height="50" rx="10"/>
  <text class="title" x="280" y="36" font-size="14" text-anchor="middle">화면</text>
  <text class="soft" x="280" y="54" font-size="11" text-anchor="middle">Compose 대화상자</text>
  <rect class="run" x="410" y="14" width="160" height="50" rx="10"/>
  <text class="title" x="490" y="44" font-size="14" text-anchor="middle">ADK Runner</text>
  <rect class="model" x="620" y="14" width="140" height="50" rx="10"/>
  <text class="title" x="690" y="44" font-size="14" text-anchor="middle">Gemma 모델</text>
  <rect class="tool" x="800" y="14" width="170" height="50" rx="10"/>
  <text class="title" x="885" y="36" font-size="14" text-anchor="middle">메모 전부 지우기</text>
  <text class="soft mono" x="885" y="54" font-size="11" text-anchor="middle">ClearAllNotesTool</text>

  <path class="life" d="M90 64 V740"/>
  <path class="life" d="M280 64 V740"/>
  <path class="life" d="M490 64 V740"/>
  <path class="life" d="M690 64 V740"/>
  <path class="life" d="M885 64 V740"/>

  <!-- 1~4 -->
  <text x="290" y="106" font-size="12.5" text-anchor="middle">① "저장한 메모 다 지워 줘"</text>
  <path class="line" d="M90 114 H486" marker-end="url(#arrow)"/>
  <text x="590" y="148" font-size="12.5" text-anchor="middle">② 요청 전달</text>
  <path class="line" d="M490 156 H686" marker-end="url(#arrow)"/>
  <text x="590" y="190" font-size="12.5" text-anchor="middle">③ 함수 호출 <tspan class="mono" font-size="11.5">clear_all_notes</tspan></text>
  <path class="back" d="M690 198 H494" marker-end="url(#arrow)"/>

  <text x="688" y="278" font-size="12.5" text-anchor="middle">④ 도구 실행 <tspan class="mono" font-size="11.5">run()</tspan></text>
  <path class="line" d="M490 286 H881" marker-end="url(#arrow)"/>
  <rect class="note" x="740" y="300" width="250" height="62" rx="8"/>
  <text x="865" y="322" font-size="12" text-anchor="middle">승인 정보가 없다 → 지우지 않는다</text>
  <text class="mono" x="865" y="342" font-size="11" text-anchor="middle">requestConfirmation(hint)</text>
  <text class="soft" x="865" y="356" font-size="10.5" text-anchor="middle">"정말 메모를 전부 지울까요?"</text>
  <text x="688" y="384" font-size="12.5" text-anchor="middle">⑤ 승인 대기 중 <tspan class="mono" font-size="11">awaiting_user_confirmation</tspan></text>
  <path class="back" d="M885 392 H494" marker-end="url(#arrow)"/>
  <text x="385" y="422" font-size="12.5" text-anchor="middle">⑥ 확인 요청 보냄</text>
  <path class="line" d="M490 430 H284" marker-end="url(#arrow)"/>
  <rect class="note" x="170" y="440" width="220" height="22" rx="6"/>
  <text x="280" y="456" font-size="11.5" text-anchor="middle">대화상자: [승인] [거부]</text>

  <!-- 7~11 -->
  <text x="185" y="518" font-size="12.5" text-anchor="middle">⑦ [승인] 누름</text>
  <path class="line" d="M90 526 H276" marker-end="url(#arrow)"/>
  <text x="385" y="556" font-size="12.5" text-anchor="middle">⑧ <tspan class="mono" font-size="11">submitConfirmation(true)</tspan></text>
  <path class="line" d="M280 564 H486" marker-end="url(#arrow)"/>
  <text x="688" y="590" font-size="12.5" text-anchor="middle">⑨ 같은 도구를 다시 실행</text>
  <path class="line" d="M490 598 H881" marker-end="url(#arrow)"/>
  <rect class="note" x="740" y="608" width="250" height="40" rx="8"/>
  <text class="mono" x="865" y="624" font-size="11" text-anchor="middle">confirmed == true</text>
  <text x="865" y="641" font-size="12" text-anchor="middle">→ 이제서야 메모를 지운다</text>
  <text x="688" y="670" font-size="12.5" text-anchor="middle">⑩ 성공, 지운 개수 5</text>
  <path class="back" d="M885 678 H494" marker-end="url(#arrow)"/>

  <text x="290" y="712" font-size="12.5" text-anchor="middle">⑪ "승인을 받아 메모 5개를 지웠어요"</text>
  <path class="back" d="M490 720 H94" marker-end="url(#arrow)"/>
</svg>
