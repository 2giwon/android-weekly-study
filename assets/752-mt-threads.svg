<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
  <title id="t">스레드가 여럿인 플랫폼과 웹의 차이</title>
  <desc id="d">위 묶음은 흐림 계산이 짧을 때다. 웹이 아닌 플랫폼에서는 계산이 다른 스레드에서 돌고, 웹에서는 같은 UI 스레드에서 프레임 작업 바로 뒤에 돈다. 둘 다 모든 틱에 프레임이 표시된다. 아래 묶음은 계산이 길 때다. 웹이 아닌 플랫폼에서는 다른 스레드가 오래 일해도 UI 스레드는 매 틱 프레임을 낸다. 웹에서는 긴 계산이 UI 스레드를 차지해 틱 하나를 놓친다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; fill: #1b2733; }
    .soft { fill: #4a5866; }
    .title { font-weight: 700; }
    .axis { stroke: #8a949e; stroke-width: 1.5; fill: none; }
    .head { fill: #8a949e; }
    .tick { stroke: #3b6ea8; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .badtick { stroke: #b4473a; stroke-width: 1.6; stroke-dasharray: 3 4; }
    .ui { fill: #e1f2ec; stroke: #2e7d6b; stroke-width: 1.6; }
    .work { fill: #e3edf9; stroke: #3b6ea8; stroke-width: 1.6; }
    .oklabel { fill: #2e7d6b; font-weight: 700; }
    .badlabel { fill: #b4473a; font-weight: 700; }
    .band { fill: #f3f5f7; }
    .sep { stroke: #c9d0d6; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e4e9ee; }
      .soft { fill: #9fadba; }
      .axis { stroke: #75808b; }
      .head { fill: #75808b; }
      .tick { stroke: #7fb0e6; }
      .badtick { stroke: #e58a7d; }
      .ui { fill: #15302a; stroke: #6cc4ad; }
      .work { fill: #172638; stroke: #7fb0e6; }
      .oklabel { fill: #6cc4ad; }
      .badlabel { fill: #e58a7d; }
      .band { fill: #161d24; }
      .sep { stroke: #2c3640; }
    }
  </style>

  <!-- 위: 계산이 짧을 때 -->
  <rect class="band" x="10" y="14" width="980" height="356" rx="10"/>
  <text class="title" x="30" y="44" font-size="15">흐림 계산이 짧을 때: 어느 쪽이든 모든 틱에 프레임이 나온다</text>

  <text class="title" x="30" y="84" font-size="13">웹이 아닌 플랫폼</text>
  <text x="30" y="122" font-size="12.5">UI 스레드</text>
  <text x="30" y="182" font-size="12.5">다른 스레드</text>
  <path class="axis" d="M200 118 H975" marker-end="url(#arrow)"/>
  <path class="axis" d="M200 178 H975" marker-end="url(#arrow)"/>
  <line class="tick" x1="220" y1="90" x2="220" y2="130"/>
  <line class="tick" x1="370" y1="90" x2="370" y2="130"/>
  <line class="tick" x1="520" y1="90" x2="520" y2="130"/>
  <line class="tick" x1="670" y1="90" x2="670" y2="130"/>
  <line class="tick" x1="820" y1="90" x2="820" y2="130"/>
  <line class="tick" x1="970" y1="90" x2="970" y2="130"/>
  <rect class="ui" x="226" y="100" width="36" height="18" rx="4"/>
  <rect class="ui" x="376" y="100" width="48" height="18" rx="4"/>
  <rect class="ui" x="526" y="100" width="20" height="18" rx="4"/>
  <rect class="ui" x="676" y="100" width="40" height="18" rx="4"/>
  <rect class="ui" x="826" y="100" width="56" height="18" rx="4"/>
  <rect class="work" x="270" y="160" width="50" height="18" rx="4"/>
  <rect class="work" x="430" y="160" width="50" height="18" rx="4"/>
  <rect class="work" x="552" y="160" width="50" height="18" rx="4"/>
  <rect class="work" x="722" y="160" width="50" height="18" rx="4"/>
  <rect class="work" x="888" y="160" width="50" height="18" rx="4"/>
  <text class="oklabel" x="970" y="150" font-size="12.5" text-anchor="end">모든 틱에 표시</text>

  <line class="sep" x1="30" y1="206" x2="970" y2="206"/>
  <text class="title" x="30" y="236" font-size="13">웹</text>
  <text x="30" y="282" font-size="12.5">UI 스레드 하나</text>
  <path class="axis" d="M200 278 H975" marker-end="url(#arrow)"/>
  <line class="tick" x1="220" y1="250" x2="220" y2="290"/>
  <line class="tick" x1="370" y1="250" x2="370" y2="290"/>
  <line class="tick" x1="520" y1="250" x2="520" y2="290"/>
  <line class="tick" x1="670" y1="250" x2="670" y2="290"/>
  <line class="tick" x1="820" y1="250" x2="820" y2="290"/>
  <line class="tick" x1="970" y1="250" x2="970" y2="290"/>
  <rect class="ui" x="226" y="260" width="36" height="18" rx="4"/>
  <rect class="work" x="266" y="260" width="50" height="18" rx="4"/>
  <rect class="ui" x="376" y="260" width="48" height="18" rx="4"/>
  <rect class="work" x="428" y="260" width="50" height="18" rx="4"/>
  <rect class="ui" x="526" y="260" width="20" height="18" rx="4"/>
  <rect class="work" x="550" y="260" width="50" height="18" rx="4"/>
  <rect class="ui" x="676" y="260" width="40" height="18" rx="4"/>
  <rect class="work" x="720" y="260" width="50" height="18" rx="4"/>
  <rect class="ui" x="826" y="260" width="56" height="18" rx="4"/>
  <rect class="work" x="886" y="260" width="50" height="18" rx="4"/>
  <text class="oklabel" x="970" y="310" font-size="12.5" text-anchor="end">모든 틱에 표시</text>
  <text class="soft" x="30" y="348" font-size="12.5">초록 = 프레임을 만드는 일, 파랑 = 흐림 계산. 웹에서는 둘이 한 줄에 이어 붙지만, 틱 사이 남는 시간 안에 끝난다.</text>

  <!-- 아래: 계산이 길 때 -->
  <rect class="band" x="10" y="390" width="980" height="356" rx="10"/>
  <text class="title" x="30" y="420" font-size="15">흐림 계산이 길 때: 웹만 프레임을 놓친다</text>

  <text class="title" x="30" y="460" font-size="13">웹이 아닌 플랫폼</text>
  <text x="30" y="498" font-size="12.5">UI 스레드</text>
  <text x="30" y="558" font-size="12.5">다른 스레드</text>
  <path class="axis" d="M200 494 H975" marker-end="url(#arrow)"/>
  <path class="axis" d="M200 554 H975" marker-end="url(#arrow)"/>
  <line class="tick" x1="220" y1="466" x2="220" y2="506"/>
  <line class="tick" x1="370" y1="466" x2="370" y2="506"/>
  <line class="tick" x1="520" y1="466" x2="520" y2="506"/>
  <line class="tick" x1="670" y1="466" x2="670" y2="506"/>
  <line class="tick" x1="820" y1="466" x2="820" y2="506"/>
  <line class="tick" x1="970" y1="466" x2="970" y2="506"/>
  <rect class="ui" x="226" y="476" width="36" height="18" rx="4"/>
  <rect class="ui" x="376" y="476" width="48" height="18" rx="4"/>
  <rect class="ui" x="526" y="476" width="20" height="18" rx="4"/>
  <rect class="ui" x="676" y="476" width="40" height="18" rx="4"/>
  <rect class="ui" x="826" y="476" width="56" height="18" rx="4"/>
  <rect class="work" x="270" y="536" width="50" height="18" rx="4"/>
  <rect class="work" x="430" y="536" width="50" height="18" rx="4"/>
  <rect class="work" x="552" y="536" width="210" height="18" rx="4"/>
  <rect class="work" x="888" y="536" width="50" height="18" rx="4"/>
  <text class="soft" x="657" y="580" font-size="12" text-anchor="middle">다른 스레드가 오래 일해도 UI 스레드는 비어 있다</text>
  <text class="oklabel" x="970" y="526" font-size="12.5" text-anchor="end">모든 틱에 표시</text>

  <line class="sep" x1="30" y1="598" x2="970" y2="598"/>
  <text class="title" x="30" y="628" font-size="13">웹</text>
  <text x="30" y="674" font-size="12.5">UI 스레드 하나</text>
  <path class="axis" d="M200 670 H975" marker-end="url(#arrow)"/>
  <line class="tick" x1="220" y1="642" x2="220" y2="682"/>
  <line class="tick" x1="370" y1="642" x2="370" y2="682"/>
  <line class="tick" x1="520" y1="642" x2="520" y2="682"/>
  <line class="badtick" x1="670" y1="642" x2="670" y2="682"/>
  <line class="tick" x1="820" y1="642" x2="820" y2="682"/>
  <line class="tick" x1="970" y1="642" x2="970" y2="682"/>
  <rect class="ui" x="226" y="652" width="36" height="18" rx="4"/>
  <rect class="work" x="266" y="652" width="50" height="18" rx="4"/>
  <rect class="ui" x="376" y="652" width="48" height="18" rx="4"/>
  <rect class="work" x="428" y="652" width="50" height="18" rx="4"/>
  <rect class="ui" x="526" y="652" width="20" height="18" rx="4"/>
  <rect class="work" x="550" y="652" width="210" height="18" rx="4"/>
  <rect class="ui" x="764" y="652" width="40" height="18" rx="4"/>
  <rect class="ui" x="826" y="652" width="56" height="18" rx="4"/>
  <rect class="work" x="886" y="652" width="50" height="18" rx="4"/>
  <text class="badlabel" x="670" y="702" font-size="12.5" text-anchor="middle">놓침</text>
  <text class="soft" x="30" y="732" font-size="12.5">긴 흐림 계산이 틱을 넘겨 UI 스레드를 붙잡았다. 그동안 다음 프레임을 만들 수 없어 그 틱은 비어 버린다.</text>
</svg>
